[project]
name = "sea"
version = "0.1.0"
description = "Sales Engineering Agent — turns sales discovery transcripts into structured artefacts (MEDDPICC discovery, retrieved case studies, follow-up email)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sea"]
